name: Create Alpine rootfs images

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:

jobs:
  create-rootfs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [armhf, armv7]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # ubuntu-latest no longer ships qemu-user-static (26.04 only has the
      # binfmt registration package), so install static ARM emulation through
      # binfmt_misc. create_minimal_alpine_image.sh detects this setup.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Create rootfs
        run: |
          echo "Creating rootfs for architecture: ${{ matrix.architecture }}"
          sudo ./create_minimal_alpine_image.sh ${{ matrix.architecture }}
          echo "Rootfs created for architecture: ${{ matrix.architecture }}"

      - name: Upload rootfs disk image
        uses: actions/upload-artifact@v4
        with:
          name: alpine-rootfs-${{ matrix.architecture }}
          path: |
            alpine.ext4
            alpine.sh
